---
- name: Check SELinux status
  command: getenforce
  register: selinux_status
  changed_when: false
  failed_when: false

- name: Disable SELinux permanently
  selinux:
    state: disabled
  when: selinux_status.stdout != "Disabled"

- name: Disable SELinux for current session
  shell: setenforce 0
  when: selinux_status.stdout != "Disabled"

- name: Install docker-ce
  package:
    name:
      - docker-ce
      - docker-compose-plugin
    state: present

# The 1 TB media disk is mounted on the Proxmox host and shared in via
# virtiofs (dir mapping "media-data"), so the VM disk can be snapshotted.
- name: Mount media share from Proxmox host (virtiofs)
  mount:
    path: "{{ media_share_path }}"
    src: "{{ media_share_tag }}"
    fstype: virtiofs
    opts: defaults,nofail
    state: mounted

# Without this, containers could start against an empty directory and
# Plex/Sonarr/Radarr would think the library is gone.
- name: Create Docker systemd drop-in directory
  file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: '0755'

- name: Make Docker wait for the media share
  copy:
    content: |
      [Unit]
      RequiresMountsFor={{ media_share_path }}
    dest: /etc/systemd/system/docker.service.d/media-mount.conf
    mode: '0644'
  register: docker_media_dropin

- name: Reload systemd after Docker drop-in change
  systemd:
    daemon_reload: yes
  when: docker_media_dropin.changed

- name: Ensure Docker service is running
  service:
    name: docker
    state: started
    enabled: yes

- name: Load iptables kernel modules
  shell: |
    modprobe ip_tables || true
    modprobe iptable_filter || true
    modprobe iptable_nat || true
    modprobe xt_conntrack || true
  changed_when: false

- name: Ensure iptables modules load on boot
  copy:
    content: |
      ip_tables
      iptable_filter
      iptable_nat
      xt_conntrack
    dest: /etc/modules-load.d/iptables.conf
    mode: '0644'

- name: Start and enable firewalld
  systemd:
    name: firewalld
    state: started
    enabled: yes

- name: Open firewall ports for media stack services
  firewalld:
    port: "{{ item }}"
    permanent: yes
    state: enabled
    immediate: yes
  loop:
    - 80/tcp        # HAProxy HTTP
    - 443/tcp       # HAProxy HTTPS
    - 139/tcp       # Samba
    - 445/tcp       # Samba
    - 5055/tcp      # Overseerr
    - 6767/tcp      # Bazarr
    - 7878/tcp      # Radarr
    - 8080/tcp      # qBittorrent
    - 8081/tcp      # Dashboard
    - 8404/tcp      # HAProxy Stats
    - 8989/tcp      # Sonarr
    - 9000/tcp      # Portainer
    - 9117/tcp      # Jackett
    - 9696/tcp      # Prowlarr
    - 11011/tcp     # Cleanuparr
    - 32400/tcp     # Plex

- name: Ensure base appdata directory exists
  file:
    path: "{{ appdata_dir }}"
    state: directory
    mode: '0755'

- name: Ensure media directory exists
  file:
    path: "{{ media_dir }}"
    state: directory
    owner: 911
    group: 100
    mode: '0775'

- name: Fix media directory permissions recursively
  file:
    path: "{{ media_dir }}"
    owner: 911
    group: 100
    mode: '0775'
    recurse: yes

- name: Ensure downloads directory exists
  file:
    path: "{{ downloads_dir }}"
    state: directory
    owner: 911
    group: 100
    mode: '0775'

- name: Fix downloads directory permissions recursively
  file:
    path: "{{ downloads_dir }}"
    owner: 911
    group: 100
    mode: '0775'
    recurse: yes

- name: Ensure transcode directory exists
  file:
    path: "{{ transcode_dir }}"
    state: directory
    owner: 911
    group: 100
    mode: '0775'

- name: Create portainer directory
  file:
    path: "{{ appdata_dir }}/portainer"
    state: directory
    mode: '0755'

- name: Create dashboard directory
  file:
    path: "{{ appdata_dir }}/dashboard"
    state: directory
    mode: '0755'

- name: Deploy dashboard HTML
  template:
    src: index.html.j2
    dest: "{{ appdata_dir }}/dashboard/index.html"
    mode: '0644'

- name: Create haproxy config directory
  file:
    path: "{{ appdata_dir }}/haproxy"
    state: directory
    mode: '0755'

- name: Generate self-signed SSL certificate for HAProxy
  shell: |
    if [ ! -f {{ appdata_dir }}/haproxy/cert.pem ]; then
      openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
        -keyout {{ appdata_dir }}/haproxy/cert.key \
        -out {{ appdata_dir }}/haproxy/cert.crt \
        -subj "/C=US/ST=State/L=City/O=Media Stack/CN={{ ansible_host }}"
      cat {{ appdata_dir }}/haproxy/cert.crt {{ appdata_dir }}/haproxy/cert.key > {{ appdata_dir }}/haproxy/cert.pem
      chmod 644 {{ appdata_dir }}/haproxy/cert.pem
    fi
  args:
    creates: "{{ appdata_dir }}/haproxy/cert.pem"

- name: Ensure certificate permissions are correct for Docker
  file:
    path: "{{ appdata_dir }}/haproxy/cert.pem"
    owner: root
    group: root
    mode: '0644'

- name: Deploy haproxy configuration
  template:
    src: haproxy.cfg.j2
    dest: "{{ appdata_dir }}/haproxy/haproxy.cfg"
    mode: '0644'

- name: Create qBittorrent config directory
  file:
    path: "{{ appdata_dir }}/binhex-qbittorrentvpn/qBittorrent/config"
    state: directory
    owner: 911
    group: 100
    mode: '0755'
    recurse: yes

- name: Deploy qBittorrent configuration with file exclusion list
  template:
    src: qBittorrent.conf.j2
    dest: "{{ appdata_dir }}/binhex-qbittorrentvpn/qBittorrent/config/qBittorrent.conf"
    owner: 911
    group: 100
    mode: '0644'

- name: Create OpenVPN config directory
  file:
    path: "{{ appdata_dir }}/binhex-qbittorrentvpn/openvpn"
    state: directory
    owner: 911
    group: 100
    mode: '0755'

# Point auth-user-pass at the deployed credentials file; a bare auth-user-pass
# makes OpenVPN prompt for a username and exit, since the container has no tty
- name: Deploy OpenVPN configuration file
  copy:
    content: "{{ lookup('file', playbook_dir + '/group_vars/all/openvpn/vpn.ovpn') | regex_replace('(?m)^\\s*auth-user-pass.*$', 'auth-user-pass /config/openvpn/credentials.conf') }}\n"
    dest: "{{ appdata_dir }}/binhex-qbittorrentvpn/openvpn/vpn.ovpn"
    owner: 911
    group: 100
    mode: '0775'

- name: Deploy OpenVPN credentials file
  copy:
    src: "{{ playbook_dir }}/group_vars/all/openvpn/credentials.conf"
    dest: "{{ appdata_dir }}/binhex-qbittorrentvpn/openvpn/credentials.conf"
    owner: 911
    group: 100
    mode: '0775'

# Cleanuparr Configuration (settings live in its web UI / database; see EXE-AUTO-CLEANUP.md)
- name: Create cleanuparr config directory
  file:
    path: "{{ appdata_dir }}/cleanuparr"
    state: directory
    owner: 911
    group: 100
    mode: '0755'

# Pinned copy of Cleanuparr's permissive blocklist: extensions only, no video or
# subtitle types. Must not contain comments, Cleanuparr treats every line as a pattern
- name: Deploy Cleanuparr malware blocklist
  copy:
    src: cleanuparr-blocklist.txt
    dest: "{{ appdata_dir }}/cleanuparr/blocklist.txt"
    owner: 911
    group: 100
    mode: '0644'

- name: Copy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ appdata_dir }}/docker-compose.yml"
    mode: '0644'

- name: Deploy media stack 
  shell: docker compose up -d --force-recreate
  args:
    chdir: "{{ appdata_dir }}"

- name: Add hourly cron job to restart qBittorrent container
  cron:
    name: "Restart qBittorrent container"
    minute: "0"
    hour: "*"
    user: root
    job: "cd {{ appdata_dir }} && docker compose restart qbittorrent >> /var/log/qbittorrent-restart.log 2>&1"
    state: present

- name: Fix SELinux context for Docker volumes after deployment
  shell: |
    # Set appropriate SELinux context for Docker volumes
    chcon -R -t container_file_t {{ appdata_dir }} 2>/dev/null || true
    # Restart HAProxy to ensure it can read the certificate
    cd {{ appdata_dir }} && docker compose restart haproxy
  failed_when: false

# Recyclarr Configuration
- name: Create recyclarr config directory
  file:
    path: "{{ appdata_dir }}/recyclarr"
    state: directory
    owner: 911
    group: 100
    mode: '0755'

- name: Deploy Recyclarr configuration
  template:
    src: recyclarr.yml.j2
    dest: "{{ appdata_dir }}/recyclarr/recyclarr.yml"
    owner: 911
    group: 100
    mode: '0644'

# Malware Monitor Configuration
- name: Create malware-monitor config directory
  file:
    path: "{{ appdata_dir }}/malware-monitor"
    state: directory
    mode: '0755'

- name: Deploy Malware Monitor script
  template:
    src: exe-monitor.sh.j2
    dest: "{{ appdata_dir }}/malware-monitor/malware-monitor.sh"
    mode: '0755'

# Wait for services to be ready before API configuration
- name: Wait for Sonarr to be ready
  uri:
    url: "http://{{ ansible_host }}:8989/api/v3/system/status"
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    method: GET
    status_code: 200
  register: sonarr_ready
  until: sonarr_ready.status == 200
  retries: 30
  delay: 10
  when: sonarr_api_key is defined

- name: Wait for Radarr to be ready
  uri:
    url: "http://{{ ansible_host }}:7878/api/v3/system/status"
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
    method: GET
    status_code: 200
  register: radarr_ready
  until: radarr_ready.status == 200
  retries: 30
  delay: 10
  when: radarr_api_key is defined

- name: Wait for Prowlarr to be ready
  uri:
    url: "http://{{ ansible_host }}:9696/api/v1/system/status"
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
    method: GET
    status_code: 200
  register: prowlarr_ready
  until: prowlarr_ready.status == 200
  retries: 30
  delay: 10
  when: prowlarr_api_key is defined

# Configure Sonarr via API
- name: Check if Sonarr qBittorrent download client exists
  uri:
    url: "http://{{ ansible_host }}:8989/api/v3/downloadclient"
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    method: GET
  register: sonarr_download_clients
  when: sonarr_api_key is defined

- name: Configure Sonarr download client (qBittorrent)
  uri:
    url: "http://{{ ansible_host }}:8989/api/v3/downloadclient"
    method: POST
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
      Content-Type: "application/json"
    body_format: json
    body:
      enable: true
      protocol: "torrent"
      priority: 1
      removeCompletedDownloads: true
      removeFailedDownloads: true
      name: "qBittorrent"
      implementation: "QBittorrent"
      configContract: "QBittorrentSettings"
      fields:
        - name: "host"
          value: "{{ ansible_host }}"
        - name: "port"
          value: 8080
        - name: "username"
          value: "admin"
        - name: "password"
          value: "adminadmin"
        - name: "category"
          value: "sonarr"
        - name: "recentTvPriority"
          value: 0
        - name: "olderTvPriority"
          value: 0
        - name: "initialState"
          value: 0
      tags: []
    status_code: [201, 400]
  when: 
    - sonarr_api_key is defined
    - sonarr_download_clients.json | selectattr('name', 'equalto', 'qBittorrent') | list | length == 0
  register: sonarr_qbit_result
  failed_when: 
    - sonarr_qbit_result.status == 400
    - "'already exists' not in (sonarr_qbit_result.json.message | default(''))"

