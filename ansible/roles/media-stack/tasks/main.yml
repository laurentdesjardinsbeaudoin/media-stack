# Configure Sonarr to prefer releases with more seeders
- name: Get Sonarr indexer config
  uri:
    url: "http://{{ ansible_host }}:8989/api/v3/config/indexer"
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    method: GET
  register: sonarr_indexer_config
  when: sonarr_api_key is defined

- name: Configure Sonarr indexer preferences (prefer more seeders)
  uri:
    url: "http://{{ ansible_host }}:8989/api/v3/config/indexer/{{ sonarr_indexer_config.json.id }}"
    method: PUT
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
      Content-Type: "application/json"
    body_format: json
    body:
      id: "{{ sonarr_indexer_config.json.id }}"
      minimumAge: 0
      retention: 0
      maximumSize: 0
      rssSyncInterval: 60
      preferIndexerFlags: true
      availabilityDelay: 0
      allowHardcodedSubs: true
      whitelistedHardcodedSubs: ""
    status_code: [200, 202]
  when: 
    - sonarr_api_key is defined
    - sonarr_indexer_config.json is defined

# Configure Radarr to prefer releases with more seeders
- name: Get Radarr indexer config
  uri:
    url: "http://{{ ansible_host }}:7878/api/v3/config/indexer"
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
    method: GET
  register: radarr_indexer_config
  when: radarr_api_key is defined

- name: Configure Radarr indexer preferences (prefer more seeders)
  uri:
    url: "http://{{ ansible_host }}:7878/api/v3/config/indexer/{{ radarr_indexer_config.json.id }}"
    method: PUT
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
      Content-Type: "application/json"
    body_format: json
    body:
      id: "{{ radarr_indexer_config.json.id }}"
      minimumAge: 0
      retention: 0
      maximumSize: 0
      rssSyncInterval: 60
      preferIndexerFlags: true
      availabilityDelay: 0
      allowHardcodedSubs: true
      whitelistedHardcodedSubs: ""
    status_code: [200, 202]
  when: 
    - radarr_api_key is defined
    - radarr_indexer_config.json is defined

# Configure Failed Download Handling
- name: Get Sonarr download client config
  uri:
    url: "http://{{ ansible_host }}:8989/api/v3/config/downloadclient"
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    method: GET
  register: sonarr_downloadclient_config
  when: sonarr_api_key is defined

- name: Enable Sonarr failed download handling (auto-blacklist and retry)
  uri:
    url: "http://{{ ansible_host }}:8989/api/v3/config/downloadclient/{{ sonarr_downloadclient_config.json.id }}"
    method: PUT
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
      Content-Type: "application/json"
    body_format: json
    body:
      id: "{{ sonarr_downloadclient_config.json.id }}"
      enableCompletedDownloadHandling: true
      removeCompletedDownloads: true
      removeFailedDownloads: true
      autoRedownloadFailed: true
      autoRedownloadFailedFromInteractiveSearch: true
      checkForFinishedDownloadInterval: 1
    status_code: [200, 202]
  when: 
    - sonarr_api_key is defined
    - sonarr_downloadclient_config.json is defined

- name: Get Radarr download client config
  uri:
    url: "http://{{ ansible_host }}:7878/api/v3/config/downloadclient"
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
    method: GET
  register: radarr_downloadclient_config
  when: radarr_api_key is defined

- name: Enable Radarr failed download handling (auto-blacklist and retry)
  uri:
    url: "http://{{ ansible_host }}:7878/api/v3/config/downloadclient/{{ radarr_downloadclient_config.json.id }}"
    method: PUT
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
      Content-Type: "application/json"
    body_format: json
    body:
      id: "{{ radarr_downloadclient_config.json.id }}"
      enableCompletedDownloadHandling: true
      removeCompletedDownloads: true
      removeFailedDownloads: true
      autoRedownloadFailed: true
      autoRedownloadFailedFromInteractiveSearch: true
      checkForFinishedDownloadInterval: 1
    status_code: [200, 202]
  when: 
    - radarr_api_key is defined
    - radarr_downloadclient_config.json is defined

# Run Recyclarr sync
- name: Run Recyclarr sync
  shell: |
    docker exec recyclarr recyclarr sync
  when: 
    - sonarr_api_key is defined
    - radarr_api_key is defined
  register: recyclarr_sync
  failed_when: false

- name: Display Recyclarr sync result
  debug:
    msg: "{{ recyclarr_sync.stdout_lines }}"
  when: recyclarr_sync.stdout_lines is defined

# Add daily Recyclarr sync cron job
- name: Add daily cron job to sync Recyclarr
  cron:
    name: "Sync Recyclarr configuration"
    minute: "0"
    hour: "6"
    user: root
    job: "cd {{ appdata_dir }} && docker exec recyclarr recyclarr sync >> /var/log/recyclarr-sync.log 2>&1"
    state: present

# Prowlarr App Sync - Auto-configure Sonarr and Radarr in Prowlarr
- name: Check if Sonarr app exists in Prowlarr
  uri:
    url: "http://{{ ansible_host }}:9696/api/v1/applications"
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
    method: GET
  register: prowlarr_apps
  when: prowlarr_api_key is defined

- name: Add Sonarr to Prowlarr applications
  uri:
    url: "http://{{ ansible_host }}:9696/api/v1/applications"
    method: POST
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "Sonarr"
      syncLevel: "addOnly"
      implementation: "Sonarr"
      configContract: "SonarrSettings"
      fields:
        - name: "baseUrl"
          value: "http://{{ ansible_host }}:8989"
        - name: "apiKey"
          value: "{{ sonarr_api_key }}"
        - name: "syncCategories"
          value: [5000, 5010, 5020, 5030, 5040, 5045, 5050, 5090]
      tags: []
    status_code: [201, 400]
  when: 
    - prowlarr_api_key is defined
    - sonarr_api_key is defined
    - prowlarr_apps.json | selectattr('name', 'equalto', 'Sonarr') | list | length == 0
  register: prowlarr_sonarr_result
  failed_when: 
    - prowlarr_sonarr_result.status == 400
    - "'already exists' not in (prowlarr_sonarr_result.json[0].errorMessage | default(''))"

- name: Add Radarr to Prowlarr applications
  uri:
    url: "http://{{ ansible_host }}:9696/api/v1/applications"
    method: POST
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "Radarr"
      syncLevel: "addOnly"
      implementation: "Radarr"
      configContract: "RadarrSettings"
      fields:
        - name: "baseUrl"
          value: "http://{{ ansible_host }}:7878"
        - name: "apiKey"
          value: "{{ radarr_api_key }}"
        - name: "syncCategories"
          value: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060, 2070, 2080, 2090]
      tags: []
    status_code: [201, 400]
  when: 
    - prowlarr_api_key is defined
    - radarr_api_key is defined
    - prowlarr_apps.json | selectattr('name', 'equalto', 'Radarr') | list | length == 0
  register: prowlarr_radarr_result
  failed_when: 
    - prowlarr_radarr_result.status == 400
    - "'already exists' not in (prowlarr_radarr_result.json[0].errorMessage | default(''))"

- name: Display Prowlarr sync status
  debug:
    msg: "Prowlarr apps configured - Indexers will auto-sync to Sonarr and Radarr"
  when: 
    - prowlarr_api_key is defined
    - sonarr_api_key is defined
    - radarr_api_key is defined

# FlareSolverr indexer proxy - Prowlarr routes indexers tagged "flaresolverr"
# through it to get past Cloudflare challenges (1337x blocks plain requests)
- name: Get Prowlarr tags
  uri:
    url: "http://{{ ansible_host }}:9696/api/v1/tag"
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
    method: GET
  register: prowlarr_tags
  when: prowlarr_api_key is defined

- name: Create flaresolverr tag in Prowlarr
  uri:
    url: "http://{{ ansible_host }}:9696/api/v1/tag"
    method: POST
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
      Content-Type: "application/json"
    body_format: json
    body:
      label: "flaresolverr"
    status_code: [201]
  register: prowlarr_flaresolverr_tag_created
  when:
    - prowlarr_api_key is defined
    - prowlarr_tags.json | selectattr('label', 'equalto', 'flaresolverr') | list | length == 0

- name: Set Prowlarr flaresolverr tag id
  set_fact:
    prowlarr_flaresolverr_tag_id: >-
      {{ prowlarr_flaresolverr_tag_created.json.id
         if prowlarr_flaresolverr_tag_created is not skipped
         else (prowlarr_tags.json | selectattr('label', 'equalto', 'flaresolverr') | map(attribute='id') | first) }}
  when: prowlarr_api_key is defined

- name: Check if FlareSolverr proxy exists in Prowlarr
  uri:
    url: "http://{{ ansible_host }}:9696/api/v1/indexerproxy"
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
    method: GET
  register: prowlarr_proxies
  when: prowlarr_api_key is defined

# Prowlarr tests the proxy on save, so retry while FlareSolverr's browser starts
- name: Add FlareSolverr indexer proxy to Prowlarr
  uri:
    url: "http://{{ ansible_host }}:9696/api/v1/indexerproxy"
    method: POST
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "FlareSolverr"
      implementation: "FlareSolverr"
      configContract: "FlareSolverrSettings"
      fields:
        - name: "host"
          value: "http://flaresolverr:8191/"
        - name: "requestTimeout"
          value: 60
      tags: "{{ [prowlarr_flaresolverr_tag_id | int] }}"
    status_code: [201]
  register: prowlarr_flaresolverr_result
  until: prowlarr_flaresolverr_result.status == 201
  retries: 6
  delay: 10
  when:
    - prowlarr_api_key is defined
    - prowlarr_proxies.json | selectattr('name', 'equalto', 'FlareSolverr') | list | length == 0

- name: Check if 1337x indexer exists in Prowlarr
  uri:
    url: "http://{{ ansible_host }}:9696/api/v1/indexer"
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
    method: GET
  register: prowlarr_indexers
  when: prowlarr_api_key is defined

# Prowlarr test-searches the site on save; through FlareSolverr that takes ~15-30s
- name: Add 1337x indexer to Prowlarr (via FlareSolverr)
  uri:
    url: "http://{{ ansible_host }}:9696/api/v1/indexer"
    method: POST
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "1337x"
      definitionName: "1337x"
      implementation: "Cardigann"
      configContract: "CardigannSettings"
      protocol: "torrent"
      enable: true
      appProfileId: 1
      priority: 25
      fields:
        - name: "definitionFile"
          value: "1337x"
        - name: "baseUrl"
          value: "https://1337x.to/"
      tags: "{{ [prowlarr_flaresolverr_tag_id | int] }}"
    status_code: [201]
    timeout: 120
  register: prowlarr_1337x_result
  until: prowlarr_1337x_result.status == 201
  retries: 3
  delay: 15
  when:
    - prowlarr_api_key is defined
    - prowlarr_indexers.json | selectattr('definitionName', 'equalto', '1337x') | list | length == 0
